
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Myanmar SRT Translator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: system-ui, sans-serif;
      background: #f4f6fb; color: #202637;
    }
    main { max-width: 850px; margin: auto; }
    h1 { font-size: 25px; margin-bottom: 6px; }
    .muted { color: #687386; font-size: 14px; }
    .panel {
      background: white; border-radius: 16px;
      padding: 18px; margin-top: 18px;
      box-shadow: 0 3px 15px #15294a0c;
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input, textarea, button {
      width: 100%; font: inherit; border-radius: 9px;
    }
    input, textarea {
      border: 1px solid #ccd3df; padding: 12px;
      background: white; color: inherit;
    }
    textarea { min-height: 300px; resize: vertical; line-height: 1.65; }
    button {
      border: 0; padding: 13px; margin-top: 12px;
      background: #3759db; color: white;
      font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    button.secondary { background: #e8edff; color: #2845b6; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    #status { white-space: pre-wrap; font-size: 14px; margin-top: 12px; }
    .good { color: #167044; }
    .bad { color: #b42318; }
    @media(max-width: 540px) {
      body { padding: 12px; }
      .row { grid-template-columns: 1fr; }
      .panel { padding: 14px; }
    }
  </style>
</head>
<body>
<main>
  <h1>မြန်မာ SRT Translator</h1>
  <div class="muted">Gemini AI · SRT Upload · မြန်မာဘာသာပြန် · Download</div>

  <section class="panel">
    <label for="file">၁။ SRT ဖိုင်ရွေးပါ</label>
    <input id="file" type="file" accept=".srt,text/plain">
    <div id="fileInfo" class="muted"></div>

    <div style="margin-top:18px">
      <label for="endpoint">၂။ Cloudflare Worker URL</label>
      <input id="endpoint" type="url"
        placeholder="https://your-worker.your-subdomain.workers.dev">
      <p class="muted">Worker ကို Deploy လုပ်ပြီး ရရှိလာတဲ့ URL ကို ထည့်ပါ။</p>
    </div>

    <button id="translate">မြန်မာဘာသာပြန်မယ်</button>
    <div id="status" role="status" aria-live="polite"></div>
  </section>

  <section class="panel">
    <label for="output">၃။ ဘာသာပြန်ထားသော SRT</label>
    <textarea id="output" spellcheck="false"
      placeholder="ဘာသာပြန်ပြီးသော SRT ကို ဒီနေရာမှာ ပြင်ဆင်နိုင်ပါတယ်။"></textarea>
    <div class="row">
      <button id="download" class="secondary">SRT Download</button>
      <button id="clear" class="secondary">ရှင်းလင်းမယ်</button>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  let originalName = "translated.srt";
  let sourceText = "";

  function status(message, type = "") {
    $("status").textContent = message;
    $("status").className = type;
  }

  $("file").addEventListener("change", async event => {
    const file = event.target.files[0];
    sourceText = "";
    $("fileInfo").textContent = "";
    $("output").value = "";
    if (!file) return;

    if (!file.name.toLowerCase().endsWith(".srt")) {
      status("SRT ဖိုင်ကိုသာ ရွေးပေးပါ။", "bad");
      event.target.value = "";
      return;
    }
    if (file.size > 500 * 1024) {
      status("ဖိုင်အရွယ်အစား 500 KB ထက် မကျော်ရပါ။", "bad");
      event.target.value = "";
      return;
    }

    sourceText = (await file.text()).replace(/^\uFEFF/, "");
    originalName = file.name.replace(/\.srt$/i, "") + "_my.srt";
    $("fileInfo").textContent =
      file.name + " · " + Math.ceil(file.size / 1024) + " KB";
    status("ဖိုင်ဖတ်ပြီးပါပြီ။ ဘာသာပြန်နိုင်ပါပြီ။", "good");
  });

  $("translate").addEventListener("click", async () => {
    const endpoint = $("endpoint").value.trim().replace(/\/+$/, "");

    if (!sourceText) {
      status("SRT ဖိုင်ကို အရင်ရွေးပါ။", "bad");
      return;
    }
    if (!/^https:\/\/[^/]+$/.test(endpoint)) {
      status("Cloudflare Worker ရဲ့ HTTPS URL အပြည့်အစုံ ထည့်ပါ။", "bad");
      return;
    }

    const button = $("translate");
    button.disabled = true;
    $("download").disabled = true;
    status("Gemini က ဘာသာပြန်နေပါတယ်။ ခဏစောင့်ပါ...");

    try {
      const response = await fetch(endpoint + "/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ srt: sourceText })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || "Server error: " + response.status);
      }
      if (typeof data.srt !== "string" || !data.srt.trim()) {
        throw new Error("ဘာသာပြန်ရလဒ် မရရှိပါ။");
      }

      $("output").value = data.srt;
      status("ဘာသာပြန်ပြီးပါပြီ။ Subtitle အရေအတွက်: " +
        (data.count ?? "—") + "\nရလဒ်ကို စစ်ဆေးပြီး Download လုပ်နိုင်ပါတယ်။", "good");
    } catch (error) {
      status("အမှား: " + error.message, "bad");
    } finally {
      button.disabled = false;
      $("download").disabled = false;
    }
  });

  $("download").addEventListener("click", () => {
    const text = $("output").value;
    if (!text.trim()) {
      status("Download လုပ်ရန် ရလဒ်မရှိသေးပါ။", "bad");
      return;
    }
    const blob = new Blob(["\uFEFF", text], {
      type: "application/x-subrip;charset=utf-8"
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = originalName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  $("clear").addEventListener("click", () => {
    sourceText = "";
    $("file").value = "";
    $("fileInfo").textContent = "";
    $("output").value = "";
    status("");
  });
})();
</script>
</body>
</html>
